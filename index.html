<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MowMode Lawn Care</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #05060a; }
    .flyer { position: relative; width: 100%; max-width: 1024px; margin: 0 auto; }
    .flyer img { display: block; width: 100%; height: auto; }
    .call-link {
      position: absolute;
      display: block;
      z-index: 10;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .call-link:focus-visible {
      outline: 3px solid #b8ff18;
      outline-offset: 2px;
    }

    /* Hotspots are percentages so they scale correctly on GitHub Pages. */
    .call-us {
      left: 32%;
      top: 49.5%;
      width: 36%;
      height: 6.5%;
    }

    .phone-number {
      left: 34%;
      top: 56.5%;
      width: 34%;
      height: 4.5%;
    }

    .bottom-phone {
      left: 50%;
      top: 84%;
      width: 44%;
      height: 7.5%;
    }
  </style>
</head>
<body>
  <main class="flyer">
    <img src="mowmode-flyer.jpg"
         alt="MowMode Lawn Care flyer">

    <a class="call-link call-us"
       href="tel:+16162604530"
       aria-label="Call MowMode Lawn Care"></a>

    <a class="call-link phone-number"
       href="tel:+16162604530"
       aria-label="Call 616-260-4530"></a>

    <a class="call-link bottom-phone"
       href="tel:+16162604530"
       aria-label="Call 616-260-4530"></a>
  </main>
</body>
</html>
